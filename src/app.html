<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /*__FAMILY_CSS__*/
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Public Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ /*__FAMILY_CSS_DARK__*/ } }
:root[data-theme="dark"]{ /*__FAMILY_CSS_DARK__*/ }
/*__THEMES_CSS__*/
/* one root size: 14px up to about 1500px wide, 19px from about 2600px, growing in between; everything else is in rem of it */
html{font-size:clamp(14px, 0.4545vw + 7.2px, 19px)}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;
  display:flex;flex-direction:column;gap:.857rem;padding-inline:1.143rem;padding-block:.857rem;box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance}
header{display:flex;align-items:center;gap:1.143rem;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:.714rem}
header h1{font-size:1.571rem}
header a.back{color:var(--ink-2);text-decoration:none;font-size:.929rem;display:inline-flex;align-items:center;gap:.286rem}
header a.back::before{content:"";width:0;height:0;border:5px solid transparent;border-inline-end:6px solid var(--ink-2)}
header a.back:hover{color:var(--ink)}
header a.back:focus-visible{outline:2px solid var(--accent)}
header .note{color:var(--ink-2);font-size:.857rem}
header a.src{margin-inline-start:auto;color:var(--ink-2);font-size:.857rem;text-decoration:none;display:inline-flex;align-items:center;gap:.286rem;border:1px solid var(--rule);border-radius:4px;padding:.286rem .571rem}
header a.src svg{width:.929rem;height:.929rem}
header a.src:hover{color:var(--ink)}
header a.src:focus-visible{outline:2px solid var(--accent)}
/* controls: one bar, pinned under the text on wide screens, fixed to the screen bottom on phones; 44px targets for touch */
.ctl{display:grid;grid-template-columns:1fr auto 1fr;gap:.571rem .714rem;align-items:center;padding-top:.714rem;border-top:1px solid var(--rule);background:var(--paper)}
.ctl button{min-height:max(3.143rem,3.15rem);background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:0 1rem;font:inherit;font-size:1.071rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.429rem}
.ctl button svg{width:1.286rem;height:1.286rem}
:root[dir="rtl"] :is(#prev,#next,.bc .pic .nav button) svg{transform:scaleX(-1)} /* the chevrons point the way the text reads */
.ctl button:disabled{opacity:.35;cursor:default}
.ctl button:focus-visible,.ctl select:focus-visible{outline:2px solid var(--accent)}
.ctl #stepno{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.929rem;text-align:center;white-space:nowrap}
.ctl .prefs{grid-column:1/-1;display:flex;gap:.571rem}
.ctl select{flex:1;min-height:max(2.857rem,2.85rem);background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:0 .571rem;font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:clamp(220px,15vw,300px) minmax(0,1fr) clamp(320px,23vw,520px);gap:1.143rem;flex:1;min-height:0}
nav.pages{overflow:auto;min-height:0}
.where,nav.pages .sheet-head,.ctl .tabs{display:none}
.peek,.legend-btn{display:none}
aside.story{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
aside.story .text{overflow:auto;min-height:0;padding-inline-end:.286rem}
nav.pages .toggle-all{display:block;width:auto;margin-block:0 .429rem;margin-inline:auto 0;background:none;border:1px solid var(--rule);border-radius:4px;color:var(--ink-2);font:inherit;font-size:.786rem;padding:3px .571rem;cursor:pointer}
nav.pages .toggle-all:hover{color:var(--ink)}
nav.pages .toggle-all:focus-visible{outline:2px solid var(--accent)}
nav.pages summary{font-family:var(--display);font-size:.929rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:.571rem 0 2px;padding-inline-start:calc(var(--depth,0)*.857rem);cursor:pointer;list-style:none;display:flex;align-items:center;gap:.429rem}
nav.pages summary::before{content:"";width:0;height:0;border:4px solid transparent;border-inline-start:5px solid var(--ink-2);transition:transform .15s}
nav.pages details[open]>summary::before{transform:rotate(90deg)}
:root[dir="rtl"] nav.pages details[open]>summary::before{transform:rotate(-90deg)}
nav.pages summary:focus-visible{outline:2px solid var(--accent)}
nav.pages button{display:block;width:100%;text-align:start;background:none;border:0;border-inline-start:2px solid transparent;color:var(--ink);
  font:inherit;padding-block:.429rem;padding-inline:calc(.714rem + var(--depth,0)*.857rem) .714rem;cursor:pointer;line-height:1.3}
nav.pages button .d{display:block;font-size:.786rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
nav.pages button[aria-current="true"]{border-inline-start-color:var(--accent);background:var(--panel)}
nav.pages button:focus-visible{outline:2px solid var(--accent)}
.stage{position:relative;min-height:30rem;border:1px solid var(--rule);background:var(--sea);overflow:hidden}
.map{position:absolute;inset:0;width:100%;height:100%}
.legend{position:absolute;inset-inline-start:.714rem;bottom:.714rem;background:var(--panel);border:1px solid var(--rule);padding:.571rem .714rem;font-size:.786rem;
  display:grid;gap:.286rem;max-width:15.714rem}
.legend .lg{display:flex;align-items:center;gap:.429rem;background:none;border:0;border-radius:3px;padding:.143rem .214rem;margin:-.143rem -.214rem;
  color:inherit;font:inherit;text-align:start;cursor:pointer}
.legend .lg:hover,.legend .lg[aria-pressed="true"]{background:var(--paper-2)}
.legend .lg:focus-visible{outline:2px solid var(--accent)}
/* the name of the highlighted zone or route: beside the pointer, or pinned at the top of the map after a tap */
.hl-label{position:absolute;z-index:4;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.857rem;line-height:1.3;
  padding:.286rem .571rem;border-radius:4px;max-width:18rem;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.hl-label.pinned{top:calc(.714rem + max(40px,2.857rem) + .429rem);left:50%;transform:translateX(-50%);max-width:calc(100% - 1.143rem);text-align:center} /* below the 2D | 3D switch */
.legend i{width:1rem;height:.714rem;display:inline-block;border:1px solid var(--ink-2);flex:none}
.legend .r{width:1rem;height:0;border:0;border-top:2px solid var(--route);position:relative}
.legend .r.arrow::after{content:"";position:absolute;inset-inline-end:-2px;top:-5px;border:4px solid transparent;border-inline-start:5px solid var(--route)}
.legend .r.dashed{border-top-style:dashed}
.credit{position:absolute;inset-inline-end:.714rem;bottom:.714rem;background:var(--panel);border:1px solid var(--rule);padding:3px .571rem;font-size:.786rem;color:var(--ink-2);pointer-events:auto;
  display:flex;align-items:center;gap:.571rem}
.credit a{color:inherit}
.credit #mapdata{background:none;border:0;border-inline-start:1px solid var(--rule);padding:0;padding-inline-start:.571rem;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.credit #mapdata svg{display:none;width:1.143rem;height:1.143rem}
.credit #mapdata:focus-visible{outline:2px solid var(--accent)}
/* the sources of the borders and the relief, opened from the credit */
.credits{position:absolute;inset-inline-end:-1px;bottom:calc(100% + .429rem);width:max-content;max-width:min(28rem,calc(100vw - 3rem));background:var(--panel);
  border:1px solid var(--rule);border-radius:4px;padding:.571rem .714rem;box-shadow:0 2px 10px rgba(0,0,0,.2);line-height:1.4}
.credits h4{margin:0 0 .286rem;font-size:.786rem;letter-spacing:.06em;text-transform:uppercase}
.credits ul{margin:0;padding-inline-start:1rem;display:grid;gap:.286rem}
.credits .made{display:none;margin:0 0 .429rem}
/* map tools: the 2D | 3D switch at the top of the map, joined on phones by the Legend button */
.maptools{position:absolute;top:.714rem;inset-inline-end:.714rem;z-index:3;display:flex;gap:.429rem;align-items:flex-start}
.view{display:flex;background:var(--panel);border:1px solid var(--rule);border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.view button{min-width:max(44px,3.143rem);min-height:calc(max(40px,2.857rem) - 2px);padding:0 .571rem;border:0;background:none;color:var(--ink);font:inherit;font-size:.929rem;font-weight:600;cursor:pointer}
.view button + button{border-inline-start:1px solid var(--rule)}
.view button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.view button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.fail{position:absolute;inset:0;display:grid;place-items:center;padding:1.714rem;text-align:center;color:var(--ink-2)}
aside.story .date{font-size:.857rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-variant-numeric:tabular-nums}
aside.story h2{font-size:1.714rem;margin:.286rem 0 .714rem;line-height:1.15}
aside.story p{margin:0 0 .714rem;max-width:62ch}
aside.story h3{font-size:.929rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-top:1.286rem;border-top:1px solid var(--rule);padding-top:.714rem}
aside.story ol{padding-inline-start:1.286rem;margin:.429rem 0;color:var(--ink-2);font-size:.857rem}
aside.story li{margin-bottom:.286rem}
aside.story figure{margin:1rem 0;max-width:62ch}
aside.story figure img{display:block;width:100%;border:1px solid var(--rule);cursor:zoom-in}
aside.story figcaption{font-size:.857rem;color:var(--ink-2);margin-top:.429rem;line-height:1.4}
aside.story figcaption small{display:block;font-size:.786rem;color:var(--ink-2);opacity:.8}
/* markers */
.mk{display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;transform:translate(0,-50%)}
.mk .wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.mk .ic{width:2rem;height:2rem;border-radius:50%;background:var(--panel);border:2px solid var(--c,var(--accent));color:var(--c,var(--accent));
  display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mk .ic svg{width:1.143rem;height:1.143rem}
.mk.battle{pointer-events:auto;cursor:pointer}
.mk.battle .ic{width:2.714rem;height:2.714rem;background:var(--accent);color:var(--paper);border-color:var(--paper);box-shadow:0 1px 5px rgba(0,0,0,.4)}
.mk.battle .ic svg{width:1.571rem;height:1.571rem}
.mk.battle b{font-size:.929rem}
.mk.battle:hover .ic{transform:scale(1.08)}
.mk .ph{width:max(3.143rem,3.15rem);height:max(3.143rem,3.15rem);border-radius:50%;object-fit:cover;border:2px solid var(--c,var(--accent));background:var(--panel);
  box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:auto;cursor:zoom-in;display:block}
.mk .ph:hover{transform:scale(1.08)}
.mk .ph:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mk .ic.badge{position:absolute;right:-0.429rem;bottom:-2px;width:1.429rem;height:1.429rem;border-width:1.5px;box-shadow:none}
.mk .ic.badge svg{width:.786rem;height:.786rem}
.mk b{font-family:var(--display);font-weight:700;font-size:.857rem;color:var(--ink);background:var(--paper);padding:0 .286rem;border-radius:2px;white-space:nowrap}
.mk small{font-size:.714rem;color:var(--ink-2);background:var(--paper);padding:0 .286rem;border-radius:2px;white-space:nowrap}
.maplibregl-marker{opacity:0;transition:opacity .6s}
.maplibregl-marker.in{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(1.143rem + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);max-width:min(40rem,calc(100% - 2.286rem));
  background:var(--ink);color:var(--paper);padding:.714rem 1rem;border-radius:4px;font-size:.929rem;display:flex;gap:.857rem;align-items:center;z-index:9;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.toast button{background:none;border:1px solid var(--paper);color:var(--paper);border-radius:3px;padding:2px .571rem;font:inherit;cursor:pointer}
.toast button:focus-visible{outline:2px solid var(--accent)}
/* battle card */
.maplibregl-popup{position:absolute;top:0;left:0;display:flex;will-change:transform;pointer-events:none;z-index:4}
.maplibregl-popup-anchor-top,.maplibregl-popup-anchor-top-left,.maplibregl-popup-anchor-top-right{flex-direction:column}
.maplibregl-popup-anchor-bottom,.maplibregl-popup-anchor-bottom-left,.maplibregl-popup-anchor-bottom-right{flex-direction:column-reverse}
.maplibregl-popup-anchor-left{flex-direction:row}
.maplibregl-popup-anchor-right{flex-direction:row-reverse}
.maplibregl-popup-tip{width:0;height:0;border:10px solid transparent;z-index:1;align-self:center}
.maplibregl-popup-anchor-top .maplibregl-popup-tip,.maplibregl-popup-anchor-top-left .maplibregl-popup-tip,.maplibregl-popup-anchor-top-right .maplibregl-popup-tip{border-top:none;border-bottom-color:var(--panel)}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip,.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip{border-bottom:none;border-top-color:var(--panel)}
.maplibregl-popup-anchor-left .maplibregl-popup-tip{border-left:none;border-right-color:var(--panel)}
.maplibregl-popup-anchor-right .maplibregl-popup-tip{border-right:none;border-left-color:var(--panel)}
.maplibregl-popup-anchor-top-left .maplibregl-popup-tip,.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip{align-self:flex-start;margin-left:1rem}
.maplibregl-popup-anchor-top-right .maplibregl-popup-tip,.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip{align-self:flex-end;margin-right:1rem}
.maplibregl-popup-content{position:relative;pointer-events:auto;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:0;width:min(28.5rem,calc(100vw - 3.429rem))}
.maplibregl-popup-close-button{position:absolute;inset-inline-end:.429rem;top:.429rem;width:1.857rem;height:1.857rem;border:0;border-radius:3px;background:none;color:var(--ink-2);font:18px/1 var(--body);cursor:pointer}
.maplibregl-popup-close-button:hover{color:var(--ink);background:var(--paper-2)}
.maplibregl-popup-close-button:focus-visible{outline:2px solid var(--accent)}
.bc{font-size:.929rem;line-height:1.4;max-height:min(40rem,70vh);overflow:auto}
.bc header{display:flex;gap:.714rem;align-items:center;padding-block:.857rem .714rem;padding-inline:1rem 2.571rem;border-bottom:1px solid var(--rule)}
.bc header .ic{flex:none;width:2.143rem;height:2.143rem;border-radius:50%;background:var(--accent);color:var(--paper);display:grid;place-items:center}
.bc header .ic svg{width:1.286rem;height:1.286rem}
.bc header h4{font-family:var(--display);font-weight:500;font-size:1.214rem;margin:0;line-height:1.2}
.bc header small{display:block;color:var(--ink-2);font-size:.857rem}
.bc .result{padding:.571rem 1rem;border-bottom:1px solid var(--rule);display:flex;gap:.571rem;align-items:baseline}
.bc .result b{font-size:.786rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.bc .sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-bottom:1px solid var(--rule)}
.bc .side{padding:.714rem 1rem;border-inline-start:3px solid var(--c,var(--rule))}
.bc .side + .side{border-top:0;box-shadow:-1px 0 0 var(--rule)}
:root[dir="rtl"] .bc .side + .side{box-shadow:1px 0 0 var(--rule)}
.bc .side h5{margin:0 0 .429rem;font-size:.929rem;font-weight:600}
.bc .side dl{margin:0;display:grid;gap:.286rem}
.bc .side dt{font-size:.786rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.bc .side dd{margin:0}
.bc .side ul{margin:0;padding-inline-start:1.143rem}
.bc .pic{margin:0;border-bottom:1px solid var(--rule)}
.bc .pic .slide{height:15rem;background:var(--paper-2)}
.bc .pic img{display:block;width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.bc .pic figcaption{padding:.429rem 1rem;font-size:.786rem;color:var(--ink-2);line-height:1.3;min-height:2.9em}
.bc .pic .nav{display:flex;align-items:center;justify-content:center;gap:.714rem;padding:2px 0 .429rem;font-size:.786rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bc .pic .nav button{width:max(2.571rem,2.6rem);height:max(2.571rem,2.6rem);border:1px solid var(--rule);border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.bc .pic .nav button svg{width:.929rem;height:.929rem}
.bc .pic .nav button:hover{background:var(--paper-2)}
.bc .pic .nav button:focus-visible{outline:2px solid var(--accent)}
.bc footer{display:flex;justify-content:flex-end;padding:.571rem 1rem}
.bc footer a{color:var(--ink-2);font-size:.857rem;display:inline-flex;gap:.286rem;align-items:center;text-decoration:none}
.bc footer a svg{width:.929rem;height:.929rem}
.bc footer a:hover{color:var(--ink)}
@media (max-width:640px){ .bc .sides{grid-template-columns:1fr} .bc .side + .side{box-shadow:none;border-top:1px solid var(--rule)} }
/* lightbox */
.lightbox{position:absolute;inset:0;background:rgba(20,18,14,.78);display:grid;place-items:center;padding:1.714rem;z-index:5}
.lightbox figure{margin:0;max-width:min(45.714rem,100%);max-height:100%;display:flex;flex-direction:column;gap:.571rem}
.lightbox img{max-width:100%;max-height:70vh;object-fit:contain;border:4px solid var(--panel);background:var(--panel)}
.lightbox figcaption{color:#efe9da;font-size:.929rem;line-height:1.4}
.lightbox figcaption small{display:block;color:#b8b09c;font-size:.786rem}
.lightbox button{position:absolute;top:.714rem;inset-inline-end:.714rem;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:.286rem .714rem;font:inherit;cursor:pointer}
.lightbox button:focus-visible{outline:2px solid var(--accent)}
/* minimal maplibre css */
.maplibregl-map{font:12px/20px sans-serif;overflow:hidden;position:relative;-webkit-tap-highlight-color:rgb(0 0 0/0)}
.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-canvas-container.maplibregl-interactive{cursor:grab;user-select:none}
.maplibregl-canvas-container.maplibregl-interactive:active{cursor:grabbing}
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate .maplibregl-canvas{touch-action:pan-x pan-y}
.maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{display:none}
@media (max-width:900px){
  /* one screen, no page scroll: header, where-you-are line, then the map or the text, then the bar */
  html,body{height:100%}
  body{height:100dvh;overflow:hidden;padding-bottom:calc(8.6rem + env(safe-area-inset-bottom, 0px))}
  header .note{display:none}
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);min-height:0}
  .stage{grid-row:2;grid-column:1;min-height:0}
  aside.story{display:contents}
  aside.story .text{grid-row:2;grid-column:1;z-index:2;background:var(--paper);overflow:auto;padding:.571rem .143rem 1.143rem}
  body[data-tab="map"] aside.story .text{display:none}
  /* in the text view the map's own overlays step aside; they sit above the text in the stacking order otherwise */
  body[data-tab="text"] :is(.peek,.maptools,.legend,.credit,.maplibregl-popup,.hl-label){display:none}
  .hl-label.pinned{top:calc(.571rem + max(40px,2.857rem) + .429rem)} /* below the map tools and the credit */
  /* the peek card: the first two lines of the page's text over the bottom of the map; a tap opens the text */
  .peek{display:block;position:absolute;inset-inline:.571rem;bottom:.571rem;z-index:3;background:var(--panel);border:1px solid var(--rule);border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.25);padding-block:.714rem;padding-inline:.857rem 2.857rem;cursor:pointer}
  .peek[hidden]{display:none}
  .peek p{margin:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;line-height:1.45}
  .peek .more{display:inline-block;margin-top:.286rem;color:var(--accent);font-weight:600;font-size:.929rem}
  .peek .close{position:absolute;top:.286rem;inset-inline-end:.286rem;width:max(44px,3.143rem);height:max(44px,3.143rem);border:0;background:none;color:var(--ink-2);font-size:1.429rem;line-height:1;cursor:pointer}
  .peek:focus-visible,.peek .close:focus-visible{outline:2px solid var(--accent)}
  /* the legend folds into a button at the top of the map with the 2D | 3D switch beside it; the credit shrinks to a button */
  .maptools{top:.571rem;inset-inline:.571rem auto}
  .legend-btn{display:inline-flex;min-height:max(40px,2.857rem);align-items:center;padding:0 .857rem;
    background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:.929rem;cursor:pointer}
  .legend-btn[hidden]{display:none}
  .legend{top:calc(.571rem + max(40px,2.857rem) + .429rem);bottom:auto;inset-inline-start:.571rem;z-index:3;max-width:calc(100% - 1.143rem)}
  body:not(.legend-open) .legend{display:none}

<body>

<header>
  <a class="back" id="back" href="../"></a>
  <h1 id="title"></h1>
  <span class="note" id="hint"></span>
  <a class="src" id="src" target="_blank" rel="noopener" hidden></a>
</header>

<main class="app">
  <div class="where" id="where"><div class="crumbs" id="crumbs"></div><div class="here" id="here"></div><button type="button" id="contents"></button></div>
  <nav class="pages" id="nav"></nav>
  <section class="stage">
    <div id="map" class="map"></div>
    <div class="maptools"><button type="button" class="legend-btn" id="legend-btn"></button><div class="view" id="view" role="group" hidden><button type="button" data-view="2d" aria-pressed="true"></button><button type="button" data-view="3d" aria-pressed="false"></button></div></div>
    <div class="legend" id="legend"></div>
    <div class="hl-label" id="hl-label" hidden></div>
    <div class="credit" id="credit"><span id="made"></span><button type="button" id="mapdata" aria-expanded="false" aria-controls="credits"></button><div class="credits" id="credits" hidden></div></div>
    <div class="peek" id="peek" role="button" tabindex="0"><p id="peek-text"></p><span class="more" id="peek-more"></span><button type="button" class="close" id="peek-close">×</button></div>
    <div class="lightbox" id="lightbox" hidden>
      <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
      <button type="button" id="lb-close"></button>
    </div>
  </section>
  <aside class="story">
    <div class="text" id="story"></div>
    <footer class="ctl">
      <button id="prev" type="button"></button>
      <span id="stepno"></span>
      <div class="tabs" role="tablist"><button type="button" role="tab" id="tab-map"></button><button type="button" role="tab" id="tab-text"></button></div>
      <button id="next" type="button"></button>
      <div class="prefs"><select id="lang"></select><select id="theme"></select></div>
    </footer>
  </aside>
</main>

<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button type="button" id="toast-close"></button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/7.2.0/turf.min.js"></script>
<script>
/*__COMMON__*/
const BUNDLE = null;

// ---------- state ----------
const B = BUNDLE;
const ICONS = B.icons;
const PAGES = B.pages;
let cur = 0;
let lang = pref('lang', B.languages, B.defaultLanguage);
let palette = pref('palette', B.themes.map(t => t.id), B.defaultTheme);
document.documentElement.dataset.palette = palette;
const T = () => B.ui[lang];
const L = field => pick(field, lang, B.defaultLanguage);

// ---------- routing: #<lang>/<page>, #<page> or #<lang> ----------
const pageIndex = id => PAGES.findIndex(p => p.id === id);
function parseHash(){
  const parts = hashParts();
  if (!parts.length) return {};

}
const writeHash = push => setHash(`#${lang}/${PAGES[cur].id}`, push);
let toastTimer = null;
function toast(text){
  $('toast-text').textContent = text; $('toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').hidden = true; }, 8000);
}
const notices = [];
{
  const r = parseHash();
  if (r.lang) {
    if (B.languages.includes(r.lang)) lang = r.lang;
    else { lang = B.defaultLanguage; notices.push(T().fallback.replace('{lang}', r.lang).replace('{name}', B.ui[lang].name ?? lang)); }
  }

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const colorVar = family => family ? `--z-${family}` : '--accent';
// A 16 px tile in the family colour, drawn so it repeats without seams: hatch, cross or dots.
function patternImage(kind, color){
  const s = 16, c = document.createElement('canvas'); c.width = c.height = s; const g = c.getContext('2d');
  g.strokeStyle = g.fillStyle = color; g.lineWidth = 2;

  if (kind === 'hatch' || kind === 'cross') { line(0, s, s, 0); line(0, s / 2, s / 2, 0); line(s / 2, s, s, s / 2); }
  if (kind === 'cross') { line(0, 0, s, s); line(s / 2, 0, s, s / 2); line(0, s / 2, s / 2, s); }
  if (kind === 'dots') for (const [x, y] of [[s / 4, s / 4], [3 * s / 4, 3 * s / 4]]) { g.beginPath(); g.arc(x, y, 2, 0, 7); g.fill(); }
  return g.getImageData(0, 0, s, s);
}
const patternCss = family => {
  const c = `var(${colorVar(family)})`, p = B.families[family]?.pattern, hatch = a => `repeating-linear-gradient(${a}deg, ${c} 0 1.5px, transparent 1.5px 5px)`;
  const img = p === 'hatch' ? hatch(45) : p === 'cross' ? `${hatch(45)}, ${hatch(-45)}` : p === 'dots' ? `radial-gradient(${c} 1.2px, transparent 1.5px) 0 0 / 5px 5px` : 'none';
  return `background:${img}, color-mix(in srgb, ${c} 55%, transparent);border-color:${c}`;
};
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUR = reduced ? 0 : 1400;

// ---------- shared helpers ----------
const countries = topojson.feature(B.topo, B.topo.objects.countries);
// the theme's land tints, picked per country by the tint index the build assigned
// Noto Sans glyphs, SIL Open Font License, fetched by range from the Protomaps assets host when a story labels its countries
const GLYPHS = 'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf';
const landFill = () => { const tints = [...Array(8)].map((_, i) => css(`--land-${i}`).trim()); return ['match', ['get', 'tint'], ...tints.flatMap((c, i) => [i, c]), tints[0]]; };
const zoneFeature = id => ({ type:'Feature', properties:{ id }, geometry: B.zones[id].geometry });
const routeFeature = (id, coords) => ({ type:'Feature', properties:{ id }, geometry:{ type:'LineString', coordinates: coords } });
const sliceRoute = (coords, t) => t <= 0 ? [] : turf.lineSliceAlong(turf.lineString(coords), 0, t * turf.length(turf.lineString(coords))).geometry.coordinates;
function markerEl(m, battle){
  const el = document.createElement('div'); el.className = battle ? 'mk battle' : 'mk'; el.style.setProperty('--c', `var(${colorVar(m.color)})`);
  const im = m.image ? B.images[m.image] : null;
  const photo = im ? `<img class="ph" src="${esc(im.src)}" alt="${esc(L(im.caption))}" tabindex="0" data-img="${esc(m.image)}"><span class="ic badge">${ICONS[m.icon]}</span>` : `<span class="ic">${ICONS[m.icon]}</span>`;
  el.innerHTML = `<span class="wrap">${photo}</span><b>${esc(L(m.label))}</b><small>${esc(L(m.note))}</small>`;
  return el;
}
function openImage(id){
  const im = B.images[id];
  $('lb-img').src = im.src; $('lb-img').alt = L(im.caption);
  $('lb-cap').innerHTML = `${esc(L(im.caption))}<small>${esc(L(im.credit))}</small>`;
  $('lightbox').hidden = false; $('lb-close').focus();
}
function closeImage(){ $('lightbox').hidden = true; }

// ---------- battles ----------
const sideColor = c => !c ? 'var(--rule)' : c.startsWith('#') ? c : `var(--z-${c})`;
function battleCard(b){
  const el = document.createElement('div'); el.className = 'bc';
  const side = s => `<div class="side" style="--c:${sideColor(s.color)}"><h5>${esc(L(s.name))}</h5><dl>
    ${s.commanders.length ? `<dt>${esc(T().commanders)}</dt><dd><ul>${s.commanders.map(c => `<li>${esc(L(c))}</li>`).join('')}</ul></dd>` : ''}
    ${s.strength ? `<dt>${esc(T().strength)}</dt><dd>${esc(L(s.strength))}</dd>` : ''}
    ${s.casualties ? `<dt>${esc(T().casualties)}</dt><dd>${esc(L(s.casualties))}</dd>` : ''}</dl></div>`;
  const pics = b.images.map(id => B.images[id]);
  // the caption sits outside the fixed height slide, else it spills under the arrows
  const pic = i => `<img src="${esc(pics[i].src)}" alt="${esc(L(pics[i].caption))}" data-img="${esc(b.images[i])}">`;
  const cap = i => esc(L(pics[i].caption));
  el.innerHTML = `<header><span class="ic">${ICONS.swords}</span><div><h4>${esc(L(b.name))}</h4><small>${esc(L(b.date))}</small></div></header>
    ${pics.length ? `<figure class="pic"><div class="slide">${pic(0)}</div><figcaption>${cap(0)}</figcaption>${pics.length > 1 ? `<div class="nav"><button type="button" data-dir="-1" aria-label="${esc(T().previous_image)}">${ICONS['chevron-left']}</button><span class="n">1 / ${pics.length}</span><button type="button" data-dir="1" aria-label="${esc(T().next_image)}">${ICONS['chevron-right']}</button></div>` : ''}</figure>` : ''}
    ${b.result ? `<div class="result"><b>${esc(T().result)}</b><span>${esc(L(b.result))}</span></div>` : ''}
    <div class="sides">${b.sides.map(side).join('')}</div>
    ${b.source ? `<footer><a href="${esc(b.source)}" target="_blank" rel="noopener">${esc(T().source)} ${ICONS['external-link']}</a></footer>` : ''}`;
  if (pics.length > 1) { // little arrows step through the images without closing the card
    let i = 0;
    el.querySelectorAll('.nav button').forEach(btn => btn.onclick = e => { e.stopPropagation(); i = (i + Number(btn.dataset.dir) + pics.length) % pics.length; el.querySelector('.slide').innerHTML = pic(i); el.querySelector('figcaption').innerHTML = cap(i); el.querySelector('.n').textContent = `${i + 1} / ${pics.length}`; });
  }
  return el;
}
let battlePopup = null;
function openBattle(id){
  const m = ML.map; if (!m) return;
  closeBattle();
  const popup = new maplibregl.Popup({ offset: 30, maxWidth: 'none', focusAfterOpen: false, anchor: 'bottom', closeOnClick: false }).setLngLat(B.battles[id].lnglat).setDOMContent(battleCard(B.battles[id])).addTo(m);
  battlePopup = popup;
  // the card's own × closes it; that counts as the reader closing it, so the map slides back
  popup.on('close', () => { if (battlePopup !== popup) return; battlePopup = null; restoreNudge(); });
  // the card sits above the marker; if it still runs past the map's edge, slide the map so it fits
  requestAnimationFrame(() => {
    if (!battlePopup) return;
    const r = battlePopup.getElement().getBoundingClientRect(), s = $('map').getBoundingClientRect(), pad = 12;
    let dx = 0, dy = 0;
    if (r.top < s.top + pad) dy = r.top - (s.top + pad); else if (r.bottom > s.bottom - pad) dy = r.bottom - (s.bottom - pad);
    if (r.left < s.left + pad) dx = r.left - (s.left + pad); else if (r.right > s.right - pad) dx = r.right - (s.right - pad);
    if (!dx && !dy) return;
    // phones remember where the map was, to slide back when the reader closes the card
    if (matchMedia('(max-width:900px)').matches) ML.beforeNudge = m.getCenter();
    m.panBy([dx, dy], { duration: reduced ? 0 : 400 });
  });
}
// restore: the reader closed the card, so undo the slide; a page change or a new card closes without it
function closeBattle(restore = false){
  const p = battlePopup; if (!p) return;
  battlePopup = null; p.remove();
  if (restore) restoreNudge(); else ML.beforeNudge = null;
}
function restoreNudge(){
  const c = ML.beforeNudge; ML.beforeNudge = null;
  if (c && ML.map) ML.map.easeTo({ center: c, duration: reduced ? 0 : 400 });
}

// ---------- terrain ----------
// The build cut elevation tiles for the story's extent at low zoom and for each page's area at the zooms it opens
// at. The map asks only for those; a refused tile makes it draw the parent tile instead.
const hasTile = (z, x, y) => (B.terrain.ranges[z] ?? []).some(([x0, y0, x1, y1]) => x >= x0 && x <= x1 && y >= y0 && y <= y1);
if (window.maplibregl) maplibregl.addProtocol('dem', async (params, abort) => {
  const [z, x, y] = params.url.slice('dem://'.length).split('/').map(Number);
  if (!hasTile(z, x, y)) throw new Error('no elevation tile');
  const res = await fetch(B.terrain.tiles.replace('{z}', z).replace('{x}', x).replace('{y}', y), { signal: abort.signal });
  if (!res.ok) throw new Error(`elevation tile ${z}/${x}/${y}: HTTP ${res.status}`);
  return { data: await res.arrayBuffer() };
});
const hexRgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
const rgba = (hex, a) => `rgba(${hexRgb(hex).join(',')},${a})`;
// relief in the theme's colours: on light paper the shadows take the ink and lit slopes the paper, on dark paper
// the shadows go black and lit slopes take a little of the light ink
function hillPaint(){
  const paper = css('--paper'), ink = css('--ink'), [r, g, b] = hexRgb(paper), dark = 0.2126 * r + 0.7152 * g + 0.0722 * b < 128;
  return { 'hillshade-exaggeration': 0.7, 'hillshade-shadow-color': dark ? 'rgba(0,0,0,0.6)' : rgba(ink, 0.5),
    'hillshade-highlight-color': dark ? rgba(ink, 0.12) : rgba(paper, 0.55), 'hillshade-accent-color': dark ? 'rgba(0,0,0,0.3)' : rgba(ink, 0.2) };
}

// ---------- map ----------
const ML = { map:null, ready:false, markers:{}, anim:{}, shown:{}, camera:0 };
function mapInit(){
  if (!window.maplibregl) { $('map').innerHTML = `<div class="fail">${esc(T().map_failed_cdn)}</div>`; return; }
  const [w, s, e, n] = B.extent;
  let m;
  try {
    m = new maplibregl.Map({
      container:'map', attributionControl:false,
      style:{ version:8, sources:{}, ...(B.labels ? { glyphs: GLYPHS } : {}), layers:[{ id:'bg', type:'background', paint:{ 'background-color': css('--sea') } }] },
      bounds:[[w, s], [e, n]], minZoom:3.5, maxZoom:B.maxZoom ?? 11, dragRotate:false, touchPitch:false, keyboard:false // arrow keys step pages, never pan
    });
    m.touchZoomRotate.disableRotation(); // turning and tilting are for the 3D view, see freeCamera
  } catch (err) { // no WebGL: keep the text and navigation working without the map
    $('map').innerHTML = `<div class="fail">${esc(T().map_failed_webgl)}</div>`; return;
  }
  ML.map = m;
  m.on('movestart', e => { if (e.originalEvent) ML.beforeNudge = null; });
  m.on('error', e => { if (!e.sourceId?.startsWith('dem')) console.error(e.error ?? e); }); // a refused elevation tile is expected
  // pointing at a zone or a route highlights it; on touch screens a tap does, and a tap on empty map clears it
  let pending = null;
  m.on('mousemove', e => { if (!canHover.matches || !ML.ready) return; const first = !pending; pending = e; if (first) requestAnimationFrame(() => { const ev = pending; pending = null; const h = !onOverlay(ev) && hitAt(ev.point); h ? setHighlight(h.kind, h.id, ev.point) : clearHighlight(); }); });
  m.on('mouseout', () => { if (canHover.matches) clearHighlight(); });
  m.on('click', e => { if (canHover.matches || !ML.ready || onOverlay(e)) return; const h = hitAt(e.point); h ? setHighlight(h.kind, h.id, null) : clearHighlight(); });
  m.on('load', () => {
    m.setPaintProperty('bg', 'background-color', css('--sea')); // the theme may have changed while the map loaded
    m.addSource('countries', { type:'geojson', data: countries });
    m.addSource('land', { type:'geojson', data: B.land });
    m.addLayer({ id:'land', type:'fill', source:'countries', paint:{ 'fill-color': landFill() } });
    // one source shades the relief, another lifts the 3D terrain; MapLibre draws both better when they are separate
    const dem = { type:'raster-dem', tiles:['dem://{z}/{x}/{y}'], tileSize:256, encoding:'terrarium', maxzoom: B.terrain.maxzoom };
    m.addSource('dem', dem); m.addSource('dem-3d', dem);
    m.addLayer({ id:'hill', type:'hillshade', source:'dem', paint: hillPaint() });
    for (const f in B.families) if (B.families[f].pattern) m.addImage('pat-' + f, patternImage(B.families[f].pattern, css(colorVar(f))));
    for (const id in B.zones) {
      const f = B.zones[id].family, c = css(colorVar(f));
      m.addSource('z-' + id, { type:'geojson', data: zoneFeature(id) });
      m.addLayer({ id:'z-' + id, type:'fill', source:'z-' + id, paint:{ 'fill-color': c, 'fill-opacity':0, 'fill-opacity-transition':{ duration:600 } } });
      if (B.families[f].pattern) m.addLayer({ id:'zp-' + id, type:'fill', source:'z-' + id, paint:{ 'fill-pattern': 'pat-' + f, 'fill-opacity':0, 'fill-opacity-transition':{ duration:600 } } });
      m.addLayer({ id:'zl-' + id, type:'line', source:'z-' + id, paint:{ 'line-color': c, 'line-width':1, 'line-opacity':0, 'line-opacity-transition':{ duration:600 } } });
    }
    m.addLayer({ id:'borders', type:'line', source:'countries', paint:{ 'line-color': css('--border'), 'line-width':0.8, 'line-dasharray':[2, 2] } });
    m.addLayer({ id:'land-outline', type:'line', source:'land', paint:{ 'line-color': css('--ink'), 'line-width':1.2 } });
    m.addImage('route-arrow', arrowImage(), { pixelRatio: 2 });
    for (const id in B.routes) {
      m.addSource('r-' + id, { type:'geojson', data: routeFeature(id, []) });
      const offset = B.routes[id].offset; // line-offset and the arrows' offset both count to the right of travel
      m.addLayer({ id:'rc-' + id, type:'line', source:'r-' + id, layout:{ 'line-cap':'round', 'line-join':'round' }, paint:{ 'line-color': css('--paper'), 'line-width':5, 'line-offset': offset } });
      const paint = { 'line-color': css('--route'), 'line-width':2.5, 'line-offset': offset };
      if (B.routes[id].style === 'dashed') paint['line-dasharray'] = [2, 1.5];
      m.addLayer({ id:'r-' + id, type:'line', source:'r-' + id, layout:{ 'line-cap':'round', 'line-join':'round' }, paint });
      if (B.routes[id].arrows) m.addLayer({ id:'ra-' + id, type:'symbol', source:'r-' + id,
        layout:{ 'symbol-placement':'line', 'symbol-spacing':70, 'icon-image':'route-arrow', 'icon-rotation-alignment':'map', 'icon-allow-overlap':true, 'icon-ignore-placement':true, 'icon-keep-upright':false, 'icon-offset':[0, offset] } });
    }
    m.addSource('emblem', { type:'geojson', data: { type:'FeatureCollection', features: [] } });
    m.addLayer({ id:'emblem', type:'fill', source:'emblem', paint:{ 'fill-color': emblemFill(), 'fill-opacity': emblemOpacity(null) } });
    m.addLayer({ id:'emblem-hl', type:'line', source:'emblem', filter: emblemOutline(null), paint:{ 'line-color': css('--ink'), 'line-width': 2 } });
    if (B.labels) { // atlas lettering: small caps in ink-2 with a land coloured halo, larger countries win a collision

  if (e.target.closest?.('input,textarea,select')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault(); // at either end the key does nothing, rather than scrolling the page or the map
    const step = (e.key === 'ArrowRight') === (T().dir === 'ltr') ? 1 : -1; // right to left text reads forward to the left
    if (PAGES[cur + step]) go(cur + step);
  }
});
$('lb-close').onclick = closeImage;
$('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeImage(); });
$('lang').onchange = e => setLang(e.target.value);
$('theme').onchange = e => setPalette(e.target.value);
$('prev').onclick = () => go(cur - 1);
$('next').onclick = () => go(cur + 1);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', mapTheme);
new MutationObserver(mapTheme).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });

renderChrome(); renderNav(); renderStory(PAGES[cur]); mapInit(); writeHash(false);
if (notices.length) toast(notices.join(' '));
</script>
